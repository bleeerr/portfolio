name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'CONTENT_NOTES.md'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Use GitHub Actions as the Pages publishing source
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: pages } = await github.rest.repos.getPages({ owner, repo });
            if (pages.build_type !== 'workflow') {
              await github.rest.repos.updateInformationAboutPagesSite({
                owner, repo, build_type: 'workflow'
              });
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
